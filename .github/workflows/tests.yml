name: Tests

# 每次 push 或开 PR 时自动跑一遍 tests/ 里的测试，
# 防止改代码时不小心把评分、加仓或推送逻辑改坏。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-push.txt
      - name: Install dependencies
        run: pip install -r requirements-push.txt pytest
      - name: Run tests
        # All market data and storage are stubbed in the tests; no Secrets needed.
        run: python -m pytest -q
